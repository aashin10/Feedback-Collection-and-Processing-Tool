// File upload handling
function handleFileSelect(event) {
    const file = event.target.files[0];
    if (file) {
        uploadedFile = file;
        displayFileInfo(file);
        showMessage('File uploaded successfully!', 'success');
        document.getElementById('generateBtn').disabled = false;
    }
}

function displayFileInfo(file) {
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');

    fileName.textContent = file.name;
    fileSize.textContent = `Size: ${(file.size / 1024 / 1024).toFixed(2)} MB`;
    fileInfo.classList.add('show');
}

function showMessage(text, type) {
    const message = document.getElementById('message');
    message.textContent = text;
    message.className = `message ${type} show`;

    setTimeout(() => {
        message.classList.remove('show');
    }, 5000);
}

// Drag and drop functionality
const uploadSection = document.getElementById('uploadSection');

uploadSection.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadSection.classList.add('dragover');
});

uploadSection.addEventListener('dragleave', () => {
    uploadSection.classList.remove('dragover');
});

uploadSection.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadSection.classList.remove('dragover');

    const files = e.dataTransfer.files;
    if (files.length > 0) {
        const file = files[0];
        if (file.type.includes('sheet') || file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
            uploadedFile = file;
            displayFileInfo(file);
            showMessage('File uploaded successfully!', 'success');
            document.getElementById('generateBtn').disabled = false;
        } else {
            showMessage('Please upload a valid Excel file (.xlsx or .xls)', 'error');
        }
    }
});

// Enhanced saveSummary function with better error handling
function saveSummary(summary) {

// Process Excel file
function processExcelFile(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = (e) => {
            try {
                console.log("Starting Excel file processing...");
                
                const data = new Uint8Array(e.target.result);
                console.log("File data loaded, size:", data.length, "bytes");
                
                const workbook = XLSX.read(data, { type: 'array' });
                console.log("Workbook loaded, sheets:", workbook.SheetNames);

                // Validate workbook has sheets
                if (!workbook.SheetNames || workbook.SheetNames.length === 0) {
                    throw new Error('No sheets found in the Excel file');
                }

                // Get the first sheet
                const sheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[sheetName];
                
                if (!sheet) {
                    throw new Error(`Sheet '${sheetName}' not found in the workbook`);
                }

                console.log("Processing sheet:", sheetName);

                // Convert sheet to JSON
                jsonData = XLSX.utils.sheet_to_json(sheet);
                console.log("Excel data loaded:", jsonData);
                console.log("Number of rows processed:", jsonData.length);
                console.log("Data type check - is array:", Array.isArray(jsonData));
                noOfResponses = jsonData.length;

                // Validate the converted data
                if (!Array.isArray(jsonData)) {
                    throw new Error('Failed to convert Excel data to array format');
                }

                if (jsonData.length === 0) {
                    throw new Error('Excel sheet appears to be empty or contains no data rows');
                }

                // Log sample of first row to understand data structure
                if (jsonData.length > 0) {
                    console.log("Sample data (first row keys):", Object.keys(jsonData[0]));
                    console.log("Sample data (first row):", jsonData[0]);
                }

                // Validate that we have meaningful data
                const firstRow = jsonData[0];
                const hasData = Object.keys(firstRow).some(key => 
                    firstRow[key] !== undefined && 
                    firstRow[key] !== null && 
                    firstRow[key] !== ''
                );

                if (!hasData) {
                    throw new Error('Excel sheet contains no meaningful data');
                }

                console.log("Excel data validation passed. Starting analysis...");

                // Process the data
                const processedData = analyzeExcelData(file);
                
                console.log("Analysis completed successfully");
                resolve(processedData);
                
            } catch (error) {
                console.error("Error in processExcelFile:", error);
                console.error("Error details:", {
                    name: error.name,
                    message: error.message,
                    stack: error.stack
                });
                
                // Provide more specific error messages
                let userFriendlyMessage = error.message;
                
                if (error.message.includes('XLSX')) {
                    userFriendlyMessage = 'Failed to read Excel file. Please ensure it\'s a valid .xlsx or .xls file.';
                } else if (error.message.includes('empty')) {
                    userFriendlyMessage = 'The Excel file appears to be empty. Please check that it contains data.';
                } else if (error.message.includes('sheets')) {
                    userFriendlyMessage = 'No sheets found in the Excel file. Please check the file format.';
                }

                reject(new Error(userFriendlyMessage));
            }
        };

        reader.onerror = (error) => {
            console.error("FileReader error:", error);
            reject(new Error('Failed to read the selected file. Please try again.'));
        };

        // Validate file before processing
        if (!file) {
            reject(new Error('No file provided for processing'));
            return;
        }

        console.log("Reading file:", file.name, "Size:", file.size, "bytes", "Type:", file.type);
        
        // Check file size (optional - adjust limit as needed)
        const maxSize = 50 * 1024 * 1024; // 50MB limit
        if (file.size > maxSize) {
            reject(new Error('File is too large. Please select a file smaller than 50MB.'));
            return;
        }

        // Check file extension
        const validExtensions = ['.xlsx', '.xls'];
        const fileExtension = file.name.toLowerCase().substring(file.name.lastIndexOf('.'));
        if (!validExtensions.includes(fileExtension)) {
            reject(new Error('Invalid file type. Please select an Excel file (.xlsx or .xls).'));
            return;
        }

        reader.readAsArrayBuffer(file);
    });
}

// Fixed analyzeExcelData function
function analyzeExcelData(file) {
    // Validate that jsonData exists and is an array
    if (!jsonData || !Array.isArray(jsonData)) {
        throw new Error("jsonData is not available or not an array. Current type: " + typeof jsonData);
    }

    if (jsonData.length === 0) {
        throw new Error("No data found in the Excel file");
    }

    console.log("Starting analysis with", jsonData.length, "entries");

    // Global counters
    const globalCounts = { Excellent: 0, "Very Good": 0, Good: 0, Average: 0, Poor: 0 };
    let totalRating = 0;
    let totalResponses = 0;

    // String to hold all feedbacks
    let whatWentWrongCombined = "";
    let whatWentWellCombined = "";

    try {
        jsonData.forEach((entry, index) => {
            console.log(`Processing entry ${index}:`, entry);
            
            const personalCount = { Excellent: 0, "Very Good": 0, Good: 0, Average: 0, Poor: 0 };

            // Count ratings
            Object.entries(entry).forEach(([key, val]) => {
                if (typeof val === 'string' && globalCounts.hasOwnProperty(val)) {
                    personalCount[val]++;
                    globalCounts[val]++;
                }
            });

            // Attach per-person count
            entry["CombinedCounts"] = personalCount;

            // Handle overall rating - try different possible column names
            let overallRating = entry["Overall program rating"] || 
                              entry["Overall Program Rating"] ||
                              entry["overall_program_rating"] ||
                              entry["Overall Rating"];
            
            if (overallRating && !isNaN(parseFloat(overallRating))) {
                totalRating += parseFloat(overallRating);
                totalResponses++;
            }

            // Collect feedback on what went wrong - improved logic
            let whatWentWrong = null;
            let whatWentWell = null;

            // First, try to find the exact column name by looking for key that contains "improvement" or "less liked"
            const feedbackKey = Object.keys(entry).find(key => 
                key.toLowerCase().includes('improvement') || 
                key.toLowerCase().includes('less liked') ||
                key.toLowerCase().includes('what needs improvement')
            );

            const feedWellKey = Object.keys(entry).find(key => 
                key.toLowerCase().includes('well') || 
                key.toLowerCase().includes('liked') ||
                key.toLowerCase().includes('What went well')
            );

            if (feedbackKey) {
                whatWentWrong = entry[feedbackKey];
            }

            if (feedWellKey) {
                whatWentWell = entry[feedWellKey];
            }

            // If we found feedback and it's a valid string, add it to our combined string
            if (whatWentWrong && typeof whatWentWrong === 'string' && whatWentWrong.trim()) {
                // Clean up the feedback text and add it
                const cleanedFeedback = whatWentWrong.trim();
                whatWentWrongCombined += cleanedFeedback;
                
                // Add period and space if the feedback doesn't already end with punctuation
                if (!cleanedFeedback.match(/[.!?]$/)) {
                    whatWentWrongCombined += ". ";
                } else {
                    whatWentWrongCombined += " ";
                }
            }

                        // If we found feedback and it's a valid string, add it to our combined string
            if (whatWentWell && typeof whatWentWell === 'string' && whatWentWell.trim()) {
                // Clean up the feedback text and add it
                const cleanedFeedback = whatWentWell.trim();
                whatWentWellCombined += cleanedFeedback;
                
                // Add period and space if the feedback doesn't already end with punctuation
                if (!cleanedFeedback.match(/[.!?]$/)) {
                    whatWentWellCombined += ". ";
                } else {
                    whatWentWellCombined += " ";
                }
            }

            console.log(`Entry ${index} feedback:`, whatWentWrong);
            console.log(`Current combined length:`, whatWentWrongCombined.length);

            console.log(`Entry ${index} feedback:`, whatWentWell);
            console.log(`Current combined length:`, whatWentWellCombined.length);
        });
    } catch (error) {
        console.error("Error during forEach processing:", error);
        throw new Error("Error processing Excel data: " + error.message);
    }

    // Clean up the combined feedback string
    whatWentWrongCombined = whatWentWrongCombined.trim();
    console.log("Combined feedback length:", whatWentWrongCombined.length);

        // Clean up the combined feedwell string
    whatWentWellCombined = whatWentWellCombined.trim();
    console.log("Combined What Went Well length:", whatWentWellCombined.length);

    // Calculate overall avg rating (avoid division by zero)
    const averageRating = totalResponses > 0 ? totalRating / totalResponses : 0;
    console.log("Average Overall Rating:", averageRating.toFixed(2));

    // Ratings we care about
    const ratingOptions = ["Excellent", "Very Good", "Good", "Average", "Poor"];

    // Object to hold results
    const questionStats = {};

    // Iterate through each row (response)
    try {
        jsonData.forEach(entry => {
            Object.entries(entry).forEach(([question, answer]) => {
                if (typeof answer === 'string' && ratingOptions.includes(answer)) {
                    // Initialize stats for this question if not already present
                    if (!questionStats[question]) {
                        questionStats[question] = {
                            Excellent: 0,
                            "Very Good": 0,
                            Good: 0,
                            Average: 0,
                            Poor: 0
                        };
                    }
                    // Increment the correct bucket
                    questionStats[question][answer]++;
                }
            });
        });
    } catch (error) {
        console.error("Error during question analysis:", error);
        throw new Error("Error analyzing questions: " + error.message);
    }

    // Get trainer name
    const trainerInput = document.getElementById('trainerName');
    const currentTrainerName = trainerInput ? trainerInput.value.trim() : "";

    // Get file name
    const currentFileName = file ? file.name : "";

    // Extract course name
    const angularMatch = currentFileName.match(/_(.*?)_/);
    const courseName = angularMatch ? angularMatch[1] : "Not found";

    // Extract batch info
    const batchMatch = currentFileName.match(/(ILP).*?Batch\s\d+.*?_(\d{4}-\d{2})/);
    const batchInfo = batchMatch ? `${batchMatch[1]} ${batchMatch[2]} Batch 5` : "Not found";

    console.log("courseName:", courseName);
    console.log("Batch Info:", batchInfo);
    console.log("whatWentWrongCombined:", whatWentWrongCombined);
    console.log("whatWentWellCombined:", whatWentWellCombined);


//ask gemini to summarize
let geminiResponse;
let cleaned;
let whatWentWrongFinal;
let whatWentWellFinal;

async function main() {
    geminiResponse = await summarizeGemini("here are 2 paragraphs containing combined feedback about 'what went wrong' and 'What went well' from all the users who attended a training section from a trainer. summarize this into 4 key points for each 1.where the trainer can i improve and what can be changed in the training and 2.where the trainer excels and what good feedback trainees have to say. write the headings for each as: 'what went wrong' and 'what went well'. keep it short and consise by only giving the headings and the 4 points for each, nothing else. paragraphs are - 'what went wrong para': '" + whatWentWrongCombined + "'. what went well para' :'" + whatWentWellCombined + "'");
    
    if (!geminiResponse) {
        console.error("Gemini response was empty");
        return;
    }

    cleaned = geminiResponse
        // remove markdown headers like ### Heading
        .replace(/###\s?.*/g, "")
        // remove bullet markers (*, -, •) with or without space
        .replace(/^\s*[\*\-•]\s*/gm, "")
        // also catch cases like "*what went wrong" (no space after the *)
        .replace(/^\s*\*/gm, "")
        // remove extra blank lines
        .replace(/\n\s*\n/g, "\n")
        // remove bold markers (**)
        .replace(/\*\*/g, "")
        .trim();

    console.log("Full Cleaned Response:\n", cleaned);

    // Split into lines
    const lines = cleaned.split("\n").map(l => l.trim()).filter(Boolean);

    // First block: lines 1–4 (skip heading)
    whatWentWrongFinal = lines.slice(1, 5).join("\n");

    // Second block: lines 6–9 (skip heading)
    whatWentWellFinal = lines.slice(6, 10).join("\n");

    console.log("\n=== What Went Wrong ===\n", whatWentWrongFinal);
    console.log("\n=== What Went Well ===\n", whatWentWellFinal);
}

async function processAfterMain() {
    console.log(cleaned);

    // Create the report summary - ensure all values are serializable
    const reportSummaryData = {
        questionAnalysis: questionStats,
        totalRatingOfTrainer: parseFloat(averageRating.toFixed(2)),
        noOfResponses: totalResponses, // Fixed: was "noOfResposes"
        trainerName: currentTrainerName || "",
        batchName: batchInfo || "",
        courseName: courseName || "",
        timestamp: new Date().toISOString(),
        globalCounts: globalCounts,
        whatWentWrongCombined: whatWentWrongFinal || "", // Added the combined feedback
        whatWentWellCombined: whatWentWellFinal || ""
    };

    console.log("Final Report Summary before saving:", reportSummaryData);

    // Save to localStorage
    saveSummary(reportSummaryData);

    // Update global reportSummary variable
    reportSummary = reportSummaryData;

    return reportSummaryData;
}

// Execute main first, then process after main completes
async function executeSequentially() {
    await main();
    return await processAfterMain();
}

// Call the sequential execution
executeSequentially();
}

        });
        
        // Create PDF with jsPDF
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        
        const imgData = canvas.toDataURL('image/png');
        const imgWidth = 210; // A4 width in mm
        const pageHeight = 295; // A4 height in mm
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        let heightLeft = imgHeight;
        let position = 0;
        
        // Add first page
        pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
        
        // Add additional pages if needed
        while (heightLeft >= 0) {
            position = heightLeft - imgHeight;
            pdf.addPage();
            pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
            heightLeft -= pageHeight;
        }
        
        // Download the PDF
        pdf.save('feedbackReport.pdf');
        
        // Clean up
        document.body.removeChild(tempContainer);
        
        console.log("PDF generated successfully");
        
    } catch (error) {
        console.error('Error downloading report:', error);

}

            margin: 1,
            filename: 'feedbackReport.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { 
                scale: 2,
                useCORS: true,
                allowTaint: true,

            },
            jsPDF: {

}

// Alternative approach: Open feedBackReport.html in new window and generate PDF from there
async function downloadReportFromWindow() {
    try {
        // Check if report data exists
        const savedData = localStorage.getItem('reportSummary');
        if (!savedData) {
            alert('No report data found. Please generate a report first.');
            return;
        }
        
        // Open the report in a new window
        const reportWindow = window.open('feedBackReport.html', '_blank', 'width=1200,height=800');
        
        if (!reportWindow) {
            alert('Please allow popups for this site to download the report.');
            return;
        }
        
        // Wait for the window to load and then generate PDF
        reportWindow.addEventListener('load', async function() {
            try {
                // Wait a bit more for dynamic content to load
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                // Use html2canvas on the new window's document
                const canvas = await html2canvas(reportWindow.document.body, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#ffffff'
                });
                
                // Create PDF
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                
                const imgData = canvas.toDataURL('image/png');
                const imgWidth = 210;
                const pageHeight = 295;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                let heightLeft = imgHeight;
                let position = 0;
                
                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;
                
                while (heightLeft >= 0) {
                    position = heightLeft - imgHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                }
                
                pdf.save('feedbackReport.pdf');
                
                // Close the popup window
                reportWindow.close();
                
            } catch (error) {
                console.error('Error generating PDF from window:', error);
                alert('Failed to generate PDF. Error: ' + error.message);
                reportWindow.close();
            }
        });
        
    } catch (error) {
        console.error('Error opening report window:', error);
        alert('Failed to open report window. Error: ' + error.message);
    }
}
