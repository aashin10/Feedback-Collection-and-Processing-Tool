<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback-Tool</title>
    <link rel="stylesheet" href="styles/indexStyles.css"/>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">FeedbackTool</a>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="hero-section">
            <h1 class="hero-title">Choose The Number of Trainers</h1>
            <p class="hero-subtitle">Select the Number of trainers to generate suitable reports.</p>
        </div>

        <div class="button-container">
            <a href="singleTrainer.html" class="trainer-button single-trainer">
                <div class="button-icon">👤</div>
                <div class="button-title">Single Trainer</div>
                <div class="button-description">Example: Angular or .Net</div>
            </a>

            <a href="multiple-trainers.html" class="trainer-button multiple-trainer">
                <div class="button-icon">👥</div>
                <div class="button-title">Multiple Trainers</div>
                <div class="button-description">Example: Technical Fundamentals or Scrum</div>
            </a>
        </div>
    </div>

    <script>
        // Add smooth scroll behavior
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
        });

        // Add click feedback
        document.querySelectorAll('.trainer-button').forEach(button => {
            button.addEventListener('click', function(e) {
                // Create ripple effect
                const ripple = document.createElement('div');
                ripple.style.position = 'absolute';
                ripple.style.borderRadius = '50%';
                ripple.style.background = 'rgba(255, 255, 255, 0.6)';
                ripple.style.transform = 'scale(0)';
                ripple.style.animation = 'ripple 0.6s linear';
                ripple.style.left = (e.clientX - this.getBoundingClientRect().left - 25) + 'px';
                ripple.style.top = (e.clientY - this.getBoundingClientRect().top - 25) + 'px';
                ripple.style.width = ripple.style.height = '50px';
                
                this.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });

        // CSS for ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
    <script src="scripts/indexScript.js"></script>
</body>
</html>
