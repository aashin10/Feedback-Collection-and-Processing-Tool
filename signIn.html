<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedbackTool | Sign In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .left-panel h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .left-panel p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .app-icon {
            font-size: 80px;
            margin-bottom: 30px;
            color: white;
        }

        .right-panel {
            flex: 1;
            padding: 40px;
        }

        .form-container {
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 32px;
            color: #333;
            font-weight: 700;
        }

        .logo span {
            color: #6e8efb;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
        }

        .tab {
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 600;
            color: #999;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: #6e8efb;
            border-bottom: 3px solid #6e8efb;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .input-with-icon input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s ease;
        }

        .input-with-icon input:focus {
            border-color: #6e8efb;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #6e8efb, #a777e3);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(110, 142, 251, 0.4);
        }

        .message {
            text-align: center;
            margin-top: 20px;
            color: #e74c3c;
            font-size: 14px;
            min-height: 20px;
        }

        .loader {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #6e8efb;
        }

        .loader i {
            margin-right: 8px;
        }

        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .page-loader i {
            font-size: 40px;
            color: #6e8efb;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                max-width: 450px;
            }
            
            .left-panel {
                padding: 30px;
            }
            
            .right-panel {
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div id="pageLoader" class="page-loader">
        <i class="fa-solid fa-spinner fa-spin"></i>
    </div>

    <div class="container">
        <div class="left-panel">
            <i class="fas fa-comment-alt app-icon"></i>
            <h2>Collect Feedback Effortlessly</h2>
            <p>FeedbackTool helps you gather, analyze, and act on customer feedback to improve your products and services.</p>
        </div>
        
        <div class="right-panel">
            <div class="form-container">
                <div class="logo">
                    <h1>Feedback<span>Tool</span></h1>
                </div>
                
                <div class="tabs">
                    <div class="tab active" id="loginTab" onclick="showLogin()">Login</div>
                    <div class="tab" id="signupTab" onclick="showSignup()">Sign Up</div>
                </div>
                
                <!-- Login Form -->
                <div id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <div class="input-with-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="loginEmail" placeholder="Enter your email">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="loginPassword" placeholder="Enter your password">
                        </div>
                    </div>
                    
                    <button class="btn" onclick="login()">Sign In</button>
                </div>
                
                <!-- Signup Form -->
                <div id="signupForm" style="display: none;">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <div class="input-with-icon">
                            <i class="fas fa-user"></i>
                            <input type="text" id="name" placeholder="Enter your full name">
                        </div>
                    </div>
                    
                    <!-- <div class="form-group">
                        <label for="department">Department</label>
                        <div class="input-with-icon">
                            <i class="fas fa-building"></i>
                            <input type="text" id="department" placeholder="Enter your department">
                        </div>
                    </div> -->
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-with-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" placeholder="Enter your email">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" placeholder="Create a password">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="confirmPassword" placeholder="Confirm your password">
                        </div>
                    </div>
                    
                    <button class="btn" onclick="signup()">Create Account</button>
                </div>
                
                <div id="message" class="message"></div>
                <div id="loader" class="loader"></div>
            </div>
        </div>
    </div>

    <!-- Firebase App (core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Firebase Authentication -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <!-- Firebase Firestore -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // ================== FIREBASE INIT ==================
        const firebaseConfig = {
            apiKey: "AIzaSyALIq-7sKX_yi4qbikHldoIDbymSem2gxg",
            authDomain: "sampledb-9009e.firebaseapp.com",
            projectId: "sampledb-9009e",
            storageBucket: "sampledb-9009e.firebasestorage.app",
            messagingSenderId: "894153581819",
            appId: "1:894153581819:web:d1d73e4345957781cb3c5e",
            measurementId: "G-7EDBYZMJVR"
        };

        // Avoid re-initialization if firebase.apps already exists
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // ================== FORM TOGGLE ==================
        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('loginTab').classList.add('active');
            document.getElementById('signupTab').classList.remove('active');
            document.getElementById('message').textContent = '';
        }

        function showSignup() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'block';
            document.getElementById('signupTab').classList.add('active');
            document.getElementById('loginTab').classList.remove('active');
            document.getElementById('message').textContent = '';
        }

        // ================== HELPERS ==================
        function showLoader(show, message = "") {
            const loader = document.getElementById("loader");
            if (loader) {
                loader.style.display = show ? "block" : "none";
                if (message) loader.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${message}`;
            }
        }

        function saveUserToken(user) {
            user.getIdToken().then(token => {
                localStorage.setItem("userToken", token);
            });
        }

        // ================== SIGNUP ==================
        function signup() {
            const name = document.getElementById("name").value;
            // const dept = document.getElementById("department").value;
            const email = document.getElementById("email").value;
            const pass = document.getElementById("password").value;
            const confirmPass = document.getElementById("confirmPassword").value;

            if (pass !== confirmPass) {
                document.getElementById("message").textContent = "Passwords do not match!";
                return;
            }

            showLoader(true, "Creating account...");
            firebase.auth().createUserWithEmailAndPassword(email, pass)
                .then(userCred => {
                    const user = userCred.user;
                    saveUserToken(user);

                    return user.updateProfile({ displayName: name })
                        .then(() => {
                            return db.collection("users").doc(user.uid).set({
                                name,
                                // department: dept,
                                email,
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        })
                        .then(() => {
                            // Cache locally for instant greeting
                            localStorage.setItem("userName", name);
                            // localStorage.setItem("userDept", dept);
                            window.location.href = "singleTrainer.html";
                        });
                })
                .catch(err => {
                    document.getElementById("message").textContent = err.message;
                })
                .finally(() => showLoader(false));
        }

        // ================== LOGIN ==================
        function login() {
            const email = document.getElementById("loginEmail").value;
            const pass = document.getElementById("loginPassword").value;

            showLoader(true, "Signing in...");
            firebase.auth().signInWithEmailAndPassword(email, pass)
                .then(userCred => {
                    const user = userCred.user;
                    saveUserToken(user);
                    return db.collection("users").doc(user.uid).get();
                })
                .then(doc => {
                    if (doc.exists) {
                        console.log("User Data:", doc.data());
                    }
                    window.location.href = "singleTrainer.html";
                })
                .catch(err => {
                    document.getElementById("message").textContent = "Invalid Credentials :(";
                })
                .finally(() => showLoader(false));
        }

        // ================== LOGOUT ==================
        function logout() {
            showLoader(true, "Logging out...");
            firebase.auth().signOut()
                .then(() => {
                    localStorage.clear();
                    showLoader(false);
                    window.location.href = "login.html";
                })
                .catch(err => {
                    console.error("Logout Error:", err);
                    showLoader(false);
                    alert("Error logging out. Try again.");
                });
        }

        // ================== PAGE LOADER FIX ==================
        window.addEventListener("load", () => {
            const pageLoader = document.getElementById("pageLoader");
            if (pageLoader) pageLoader.style.display = "none";
        });
    </script>
</body>
</html>
